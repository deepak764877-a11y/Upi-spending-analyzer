<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Spending Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background: #1e293b; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .feature-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📊 UPI Spending Analyzer</a>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="feature-box">
                    <h5 class="fw-bold mb-3">Upload CSV Statement</h5>
                    <form action="/upload" method="POST" enctype="multipart/form-data">
                        <input type="file" name="file" accept=".csv" class="form-control mb-3" required>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Analyze Statement 🚀</button>
                    </form>
                    
                    <form action="/clear-data" method="POST" class="mt-3">
                        <button type="submit" class="btn btn-danger w-100 btn-sm fw-bold" onclick="return confirm('Are you sure you want to clear all data?');">Clear All Data 🗑️</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card p-3">
                            <h6 class="fw-bold text-center mb-3">Category-wise Spending</h6>
                            <div style="max-height: 250px;">
                                <canvas id="pieChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card p-3">
                            <h6 class="fw-bold text-center mb-3">Monthly Trends</h6>
                            <div style="max-height: 250px;">
                                <canvas id="barChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        const pieDataRaw = {{ pie_data|tojson }};
        new Chart(pieCtx, {
            type: 'pie',
            data: {
                labels: pieDataRaw.map(row => row[0]),
                datasets: [{
                    data: pieDataRaw.map(row => row[1]),
                    backgroundColor: ['#ff6384', '#36a2eb', '#cc65fe', '#ffce56', '#4bc0c0']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });

        const barCtx = document.getElementById('barChart').getContext('2d');
        const barDataRaw = {{ bar_data|tojson }};
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: barDataRaw.map(row => row[0]),
                datasets: [{
                    label: 'Monthly Spends',
                    data: barDataRaw.map(row => row[1]),
                    backgroundColor: '#36a2eb',
                    maxBarThickness: 40
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    </script>
</body>
</html>
