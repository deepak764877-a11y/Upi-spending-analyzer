<!DOCTYPE html>
<html>
<head>
    <title>UPI Spending Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container text-center mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 700px;">
            <h1 class="text-primary mb-3">📊 UPI Spending Analyzer</h1>
            <p class="text-secondary">Upload your bank statement — view your spending patterns</p>
            <hr>
            
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <input type="file" name="file" accept=".csv" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">Analyze Now 🚀</button>
            </form>

            <hr>

            <div class="row mt-4">
                <div class="col-md-6">
                    <h5>Total Spent: <span class="text-danger">₹{{ stats.total_spent or 0 }}</span></h5>
                    <h5>Total Count: {{ stats.total_count or 0 }}</h5>
                    
                    <table class="table table-bordered mt-3">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for row in category_data %}
                            <tr>
                                <td>{{ row['category'] }}</td>
                                <td>₹{{ row['total'] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                
                <div class="col-md-6">
                    <canvas id="spendingChart" width="200" height="200"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <input type="hidden" id="chartLabels" value='{{ chart_labels | tojson }}'>
    <input type="hidden" id="chartValues" value='{{ chart_values | tojson }}'>

    <script>
        var labels = JSON.parse(document.getElementById('chartLabels').value || '[]');
        var values = JSON.parse(document.getElementById('chartValues').value || '[]');
        
        if (labels.length > 0) {
            var ctx = document.getElementById('spendingChart').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF']
                    }]
                }
            });
        }
    </script>
</body>
</html>
